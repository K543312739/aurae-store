# ---- 微缓存（micro-cache）：降低 TTFB，仅对匿名 GET 生效 ----
# 带 query string 的（?__bot=1 / ?order_id= 等）通过 $is_args 绕过，不缓存用户/支付相关响应
proxy_cache_path /var/cache/nginx/microcache levels=1:2 keys_zone=microcache:10m max_size=256m inactive=10m use_temp_path=off;

# 标记 bot UA，避免微缓存混淆 SSR（bot）与 SPA（用户）响应
map $http_user_agent $is_bot_ua {
    default 0;
    "~*(googlebot|bingbot|yandex|duckduckbot|baiduspider|slurp|facebookexternalhit|twitterbot|linkedinbot|pinterest|embedly|whatsapp|telegrambot|slackbot|discordbot|ia_archiver|applebot|rogerbot|dotbot|semrush|ahrefs|mj12bot|blexbot|seokicks|bytespider|crawler|spider|bot|preview)" 1;
}

server {
    listen 80;
    server_name aurae.asia www.aurae.asia;
    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- apex 域名统一 301 到 www，集中权重、避免重复内容 ----
server {
    listen 443 ssl http2;
    server_name aurae.asia;

    ssl_certificate     /etc/letsencrypt/live/aurae.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurae.asia/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    return 301 https://www.aurae.asia$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.aurae.asia;

    ssl_certificate     /etc/letsencrypt/live/aurae.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurae.asia/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10M;

    # ---- 性能优化：gzip 压缩（含 proxy 回源响应）----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml image/x-icon;

    # ---- sitemap / robots：必须禁止缓存，搜索引擎每次都要抓最新内容 ----
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Alternate sitemap filename for GSC in case /sitemap.xml is cached as failed.
    location = /sitemap-v3.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ---- 静态资源：长期不可变缓存（图片/字体/图标/webmanifest）----
    # 注意：sitemap.xml / robots.txt 已在上方单独处理，不参与本缓存策略
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|webmanifest)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # ---- JS/CSS：stale-while-revalidate，部署后最多 2h 全量生效，不阻塞用户 ----
    location ~* \.(js|css)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=7200, stale-while-revalidate=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_cache microcache;
        proxy_ignore_headers Cache-Control;
        proxy_cache_valid 200 5s;
        proxy_cache_valid any 1s;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_bypass $is_args $is_bot_ua;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
