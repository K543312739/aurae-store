<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurae · Admin — Management Console</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --admin-bg: #f7f5f2;
      --admin-card: #ffffff;
      --admin-border: #e8e4dd;
      --admin-text: #2b2b2b;
      --admin-muted: #8a857c;
      --admin-primary: #4a5d3e;
      --admin-primary-dark: #2f3d27;
      --admin-accent: #9b7bd4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--admin-bg); color: var(--admin-text);
      font-family: 'Inter', sans-serif; line-height: 1.6;
    }
    .admin-header {
      background: var(--admin-primary-dark); color: #fff;
      padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
    }
    .admin-header .logo { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 600; letter-spacing: 1px; }
    .admin-header .logo span { color: var(--admin-accent); }
    .admin-header .sub { font-size: 13px; opacity: 0.8; }
    .admin-main { max-width: 1040px; margin: 0 auto; padding: 40px 20px 80px; }

    .admin-login { max-width: 400px; margin: 80px auto; }
    .admin-login-card {
      background: var(--admin-card); border: 1px solid var(--admin-border);
      border-radius: 16px; padding: 40px 32px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.06);
    }
    .admin-login-icon { font-size: 44px; margin-bottom: 12px; }
    .admin-login-card h2 { font-family: 'Cormorant Garamond', serif; font-size: 30px; margin: 0 0 8px; color: var(--admin-primary-dark); }
    .admin-login-card p { color: var(--admin-muted); font-size: 14px; margin: 0 0 24px; }
    .admin-login-card input {
      width: 100%; padding: 13px 16px; border: 2px solid var(--admin-border);
      border-radius: 10px; font-size: 15px; margin-bottom: 18px; transition: 0.2s;
    }
    .admin-login-card input:focus { outline: none; border-color: var(--admin-primary); }
    .admin-error { color: #c0392b; font-size: 13px; min-height: 18px; margin: 10px 0 0; }
    .btn {
      display: inline-block; border: none; border-radius: 10px; cursor: pointer;
      font-size: 14px; font-weight: 600; padding: 12px 22px; transition: 0.2s;
      font-family: inherit;
    }
    .btn-dark { background: var(--admin-primary); color: #fff; }
    .btn-dark:hover { background: var(--admin-primary-dark); }
    .btn-full { width: 100%; }
    .btn-sm { padding: 9px 18px; font-size: 13px; }
    .btn-outline { background: transparent; border: 1.5px solid var(--admin-border); color: var(--admin-text); }
    .btn-outline:hover { border-color: var(--admin-primary); color: var(--admin-primary-dark); }
    .btn-danger { background: #c0392b; color: #fff; }
    .btn-success { background: #2f7d4f; color: #fff; }
    .btn-success:hover { background: #256040; }
    .list-search { padding: 9px 12px; border: 1.5px solid var(--admin-border); border-radius: 8px; font-size: 13px; min-width: 260px; font-family: inherit; }
    .list-search:focus { outline: none; border-color: var(--admin-primary); }

    .admin-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px; flex-wrap: wrap; gap: 12px;
    }
    .admin-toolbar h2 { font-family: 'Cormorant Garamond', serif; font-size: 32px; margin: 0; color: var(--admin-primary-dark); }
    .admin-count { display: block; font-size: 13px; color: var(--admin-muted); margin-top: 2px; }
    .admin-toolbar > div:last-child { display: flex; gap: 10px; flex-wrap: wrap; }

    .admin-tabs { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; border-bottom: 1px solid var(--admin-border); }
    .admin-tab {
      background: transparent; border: none; cursor: pointer; font-family: inherit;
      font-size: 14px; font-weight: 600; color: var(--admin-muted);
      padding: 12px 18px; border-bottom: 3px solid transparent; transition: 0.2s;
    }
    .admin-tab:hover { color: var(--admin-primary-dark); }
    .admin-tab.active { color: var(--admin-primary-dark); border-bottom-color: var(--admin-primary); }
    .admin-panel { display: none; }
    .admin-panel.active { display: block; }
    .admin-loading { text-align: center; color: var(--admin-muted); padding: 50px; }
    .empty-box { text-align: center; color: var(--admin-muted); padding: 60px 20px; background: var(--admin-card); border-radius: 14px; border: 1px dashed var(--admin-border); }

    /* Messages */
    .admin-messages { display: flex; flex-direction: column; gap: 18px; }
    .msg-card {
      background: var(--admin-card); border: 1px solid var(--admin-border);
      border-left: 4px solid var(--admin-border); border-radius: 14px; padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.04);
    }
    .msg-card.status-new { border-left-color: #d9a441; }
    .msg-card.status-read { border-left-color: #6c8ebf; }
    .msg-card.status-replied { border-left-color: var(--admin-primary); }
    .msg-head { display: flex; gap: 14px; align-items: flex-start; }
    .msg-avatar {
      width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
      background: var(--admin-primary); color: #fff; display: flex; align-items: center; justify-content: center;
      font-weight: 600; font-size: 17px;
    }
    .msg-meta { flex: 1; }
    .msg-name { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .msg-status {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
      padding: 2px 9px; border-radius: 20px; background: #f0ece4; color: var(--admin-muted);
    }
    .msg-card.status-new .msg-status { background: #fbf0d9; color: #9a6b16; }
    .msg-card.status-read .msg-status { background: #e6eef7; color: #3d6296; }
    .msg-card.status-replied .msg-status { background: #e7ede2; color: var(--admin-primary-dark); }
    .msg-sub { font-size: 13px; color: var(--admin-muted); margin-top: 2px; }
    .msg-body { margin: 16px 0; padding: 14px 16px; background: #faf8f5; border-radius: 10px; font-size: 14.5px; white-space: pre-wrap; line-height: 1.7; }
    .msg-replies { display: flex; flex-direction: column; gap: 12px; margin: 14px 0; }
    .msg-reply { background: #f1f4ee; border-radius: 10px; padding: 13px 16px; margin-left: 28px; border: 1px solid #e0e6d8; }
    .msg-reply-meta { font-size: 12px; color: var(--admin-primary-dark); font-weight: 600; margin-bottom: 4px; }
    .msg-reply-body { font-size: 14px; white-space: pre-wrap; line-height: 1.6; }
    .msg-reply-box { margin-top: 14px; }
    .msg-reply-box textarea {
      width: 100%; padding: 12px 14px; border: 1.5px solid var(--admin-border);
      border-radius: 10px; font-size: 14px; font-family: inherit; resize: vertical; min-height: 80px; transition: 0.2s;
    }
    .msg-reply-box textarea:focus { outline: none; border-color: var(--admin-primary); }

    /* Orders */
    .order-card { background: var(--admin-card); border: 1px solid var(--admin-border); border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.04); }
    .order-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .order-id { font-weight: 700; font-size: 16px; }
    .order-meta { font-size: 13px; color: var(--admin-muted); margin-top: 2px; }
    .status-badge { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; padding: 4px 12px; border-radius: 20px; background: #eee; color: #555; white-space: nowrap; }
    .status-badge.paid { background: #e7ede2; color: #2f3d27; }
    .status-badge.shipped { background: #e6eef7; color: #3d6296; }
    .status-badge.delivered { background: #fbf0d9; color: #9a6b16; }
    .status-badge.pending_payment, .status-badge.expired { background: #fae3e1; color: #c0392b; }
    .order-items { margin: 14px 0; padding: 14px 16px; background: #faf8f5; border-radius: 10px; font-size: 14px; }
    .order-items div { padding: 2px 0; }
    .order-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-top: 12px; }
    .order-actions input { padding: 10px 12px; border: 1.5px solid var(--admin-border); border-radius: 8px; font-size: 13px; font-family: inherit; }
    .order-actions label { font-size: 12px; color: var(--admin-muted); display: block; margin-bottom: 4px; }

    /* Tables for products / coupons */
    table.admin-table { width: 100%; border-collapse: collapse; background: var(--admin-card); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,0.04); }
    .admin-table th, .admin-table td { padding: 13px 14px; text-align: left; border-bottom: 1px solid var(--admin-border); font-size: 14px; }
    .admin-table th { background: #f0ece4; color: var(--admin-primary-dark); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-table input[type=number] { width: 90px; padding: 8px 10px; border: 1.5px solid var(--admin-border); border-radius: 8px; font-family: inherit; }
    .admin-table input[type=text] { padding: 8px 10px; border: 1.5px solid var(--admin-border); border-radius: 8px; font-family: inherit; }
    .pill { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
    .pill.on { background: #e7ede2; color: #2f3d27; }
    .pill.off { background: #eee; color: #888; }
    .row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .add-form { background: var(--admin-card); border: 1px solid var(--admin-border); border-radius: 14px; padding: 20px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; align-items: end; }
    .add-form h3 { grid-column: 1 / -1; margin: 0 0 4px; font-family: 'Cormorant Garamond', serif; color: var(--admin-primary-dark); }
    .add-form label { font-size: 12px; color: var(--admin-muted); display: block; margin-bottom: 4px; }
    .add-form input, .add-form select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--admin-border); border-radius: 8px; font-family: inherit; font-size: 14px; }
    .add-form .checkbox { display: flex; align-items: center; gap: 8px; }
    .add-form .checkbox input { width: auto; }

    /* Product manager */
    .product-card { background: var(--admin-card); border: 1px solid var(--admin-border); border-radius: 14px; padding: 16px; display: flex; gap: 16px; margin-bottom: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.04); }
    .product-thumb { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #f3f1ec; }
    .product-info { flex: 1; min-width: 0; }
    .product-info h4 { margin: 0 0 4px; font-size: 16px; }
    .product-info .meta { font-size: 13px; color: var(--admin-muted); }
    .product-actions { display: flex; flex-direction: column; gap: 8px; justify-content: center; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-box { background: #fff; border-radius: 16px; width: 100%; max-width: 760px; max-height: 92vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid var(--admin-border); }
    .modal-head h3 { margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 24px; color: var(--admin-primary-dark); }
    .modal-close { background: none; border: none; font-size: 28px; line-height: 1; cursor: pointer; color: var(--admin-muted); }
    .modal-close:hover { color: #c0392b; }
    .modal-body { padding: 24px; overflow-y: auto; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    .form-field label { font-size: 12px; color: var(--admin-muted); display: block; margin-bottom: 4px; }
    .form-field input, .form-field select, .form-field textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--admin-border); border-radius: 8px; font-family: inherit; font-size: 14px; }
    .form-field input:focus, .form-field select:focus, .form-field textarea:focus { outline: none; border-color: var(--admin-primary); }
    .form-field.full { grid-column: 1 / -1; }
    .form-field textarea { resize: vertical; min-height: 80px; }
    .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .img-cell { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--admin-border); background: #f3f1ec; }
    .img-cell img { width: 100%; height: 100%; object-fit: cover; }
    .img-cell.cover::after { content: 'COVER'; position: absolute; top: 4px; left: 4px; font-size: 9px; font-weight: 700; background: var(--admin-primary); color: #fff; padding: 2px 6px; border-radius: 6px; }
    .img-cell .del { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: rgba(192,57,43,0.92); color: #fff; border: none; cursor: pointer; font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .img-cell .setcover { position: absolute; bottom: 4px; left: 4px; font-size: 10px; background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 6px; padding: 2px 6px; cursor: pointer; }
    .img-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* Dashboard */
    .dash-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .dash-card { background: var(--admin-card); border: 1px solid var(--admin-border); border-radius: 14px; padding: 20px; box-shadow: 0 4px 18px rgba(0,0,0,0.04); }
    .dash-card-label { font-size: 12px; color: var(--admin-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .dash-card-value { font-size: 28px; font-weight: 700; font-family: 'Cormorant Garamond', serif; color: var(--admin-primary-dark); margin-top: 6px; }
    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
    .dash-box { background: var(--admin-card); border: 1px solid var(--admin-border); border-radius: 14px; padding: 20px; box-shadow: 0 4px 18px rgba(0,0,0,0.04); }
    .dash-box h3 { margin: 0 0 14px; font-family: 'Cormorant Garamond', serif; font-size: 20px; color: var(--admin-primary-dark); }
    .dash-table { width: 100%; border-collapse: collapse; }
    .dash-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--admin-muted); padding: 6px 8px; border-bottom: 1px solid var(--admin-border); }
    .dash-table td { padding: 8px; font-size: 14px; border-bottom: 1px solid var(--admin-border); }
    .dash-table tr:last-child td { border-bottom: none; }
    .dash-empty { text-align: center; color: var(--admin-muted); padding: 20px; }
    .dash-chart { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding: 10px 0; }
    .dash-bar { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
    .dash-bar-fill { width: 60%; max-width: 40px; background: linear-gradient(180deg, var(--admin-primary), var(--admin-accent)); border-radius: 6px 6px 0 0; min-height: 2px; transition: 0.3s; }
    .dash-bar-label { font-size: 11px; color: var(--admin-muted); margin-top: 6px; }
    .dash-bar-val { font-size: 11px; font-weight: 600; color: var(--admin-primary-dark); }

    /* Reviews / Moderation */
    .review-filter { display: flex; gap: 8px; flex-wrap: wrap; }
    .rf-btn { background: transparent; border: 1.5px solid var(--admin-border); color: var(--admin-muted); border-radius: 20px; padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: 0.2s; }
    .rf-btn:hover { border-color: var(--admin-primary); color: var(--admin-primary-dark); }
    .rf-btn.active { background: var(--admin-primary); border-color: var(--admin-primary); color: #fff; }
    .rev-card { background: var(--admin-card); border: 1px solid var(--admin-border); border-left: 4px solid var(--admin-border); border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 4px 18px rgba(0,0,0,0.04); }
    .rev-card.status-pending { border-left-color: #d9a441; }
    .rev-card.status-approved { border-left-color: var(--admin-primary); }
    .rev-card.status-rejected { border-left-color: #c0392b; }
    .rev-head { display: flex; gap: 12px; align-items: flex-start; }
    .rev-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; background: var(--admin-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; }
    .rev-meta { flex: 1; min-width: 0; }
    .rev-name { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .rev-rating { color: #d9a441; letter-spacing: 1px; }
    .rev-status { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; padding: 2px 9px; border-radius: 20px; background: #f0ece4; color: var(--admin-muted); }
    .rev-sub { font-size: 13px; color: var(--admin-muted); margin-top: 2px; }
    .rev-title { font-weight: 600; margin: 12px 0 4px; font-size: 15px; }
    .rev-body { font-size: 14.5px; line-height: 1.7; white-space: pre-wrap; }
    .rev-imgs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .rev-img { width: 84px; height: 84px; border-radius: 8px; object-fit: cover; border: 1px solid var(--admin-border); cursor: pointer; }
    .rev-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

    /* Users table */
    .user-table { display: flex; flex-direction: column; gap: 2px; }
    .user-row { display: grid; grid-template-columns: 1.4fr 2fr 1fr 0.8fr 0.9fr; gap: 12px; align-items: center; padding: 14px 16px; background: #fff; border: 1px solid var(--admin-border); border-radius: 10px; font-size: 14px; }
    .user-row.user-head { background: transparent; border: none; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--admin-muted); padding-bottom: 4px; }
    .user-name { font-weight: 600; }
    .user-email { color: var(--admin-text); word-break: break-all; }
    .user-date, .user-orders { color: var(--admin-muted); }
    .user-actions { text-align: right; }
    @media (max-width: 760px) {
      .user-row { grid-template-columns: 1fr 1fr; row-gap: 6px; }
      .user-row.user-head { display: none; }
      .user-actions { text-align: left; }
    }

    @media (max-width: 600px) {
      .admin-toolbar h2 { font-size: 26px; }
      .msg-reply { margin-left: 12px; }
    }
  </style>
</head>
<body>

  <header class="admin-header">
    <div>
      <div class="logo">Aur<span>ae</span> Admin</div>
      <div class="sub">Management Console</div>
    </div>
    <div style="font-size:13px;opacity:0.85;">🔒 Private Area</div>
  </header>

  <main class="admin-main">

    <!-- Login -->
    <section id="adminLogin" class="admin-login">
      <div class="admin-login-card">
        <div class="admin-login-icon">🔐</div>
        <h2>Admin Sign In</h2>
        <p>Enter your admin password to manage orders, inventory, coupons and messages.</p>
        <input type="password" id="adminPassword" placeholder="Admin password" onkeydown="if(event.key==='Enter')adminLogin()">
        <button class="btn btn-dark btn-full" onclick="adminLogin()">Sign In</button>
        <p class="admin-error" id="adminLoginError"></p>
      </div>
    </section>

    <!-- Dashboard -->
    <section id="adminDashboard" style="display:none;">
      <div class="admin-toolbar">
        <div>
          <h2 id="panelTitle">Customer Messages</h2>
          <span class="admin-count" id="adminCount"></span>
        </div>
        <div>
          <button class="btn btn-outline" onclick="openChangePassword()">🔑 Change Password</button>
          <button class="btn btn-outline" onclick="refreshCurrentTab()">↻ Refresh</button>
          <button class="btn btn-dark" onclick="adminLogout()">Log Out</button>
        </div>
      </div>

      <div class="admin-tabs">
        <button class="admin-tab active" id="tab-messages" onclick="switchTab('messages')">💬 Messages</button>
        <button class="admin-tab" id="tab-orders" onclick="switchTab('orders')">📦 Orders</button>
        <button class="admin-tab" id="tab-products" onclick="switchTab('products')">📊 Inventory</button>
        <button class="admin-tab" id="tab-coupons" onclick="switchTab('coupons')">🏷️ Coupons</button>
        <button class="admin-tab" id="tab-dashboard" onclick="switchTab('dashboard')">📈 Dashboard</button>
        <button class="admin-tab" id="tab-reviews" onclick="switchTab('reviews')">⭐ Reviews</button>
        <button class="admin-tab" id="tab-users" onclick="switchTab('users')">👥 Users</button>

  <div id="passwordModal" class="modal-overlay" style="display:none;">

          <button type="button" class="btn btn-outline" onclick="closeChangePassword()">Cancel</button>
          <button type="button" class="btn btn-dark" onclick="changePassword()">Update Password</button>
        </div>

  <script>
    const ADMIN_TOKEN_KEY = 'auraeAdminToken';
    let token = localStorage.getItem(ADMIN_TOKEN_KEY) || '';
    let currentTab = 'messages';

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function formatDate(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleString('en-US', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch (e) { return iso || ''; }
    }

    function money(n) { return '$' + (Number(n) || 0).toFixed(2); }

    function showDashboard() {
      document.getElementById('adminLogin').style.display = 'none';
      document.getElementById('adminDashboard').style.display = 'block';
    }

    function showLogin() {
      document.getElementById('adminLogin').style.display = 'block';
      document.getElementById('adminDashboard').style.display = 'none';
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
      const titles = { messages: 'Customer Messages', orders: 'Orders', products: 'Inventory', coupons: 'Coupons', dashboard: 'Sales Dashboard', reviews: 'Review Moderation', users: 'Registered Users', subscribers: 'Newsletter Subscribers', refunds: 'Refund / Return Requests' };
      document.getElementById('panelTitle').textContent = titles[tab];
      refreshCurrentTab();
    }

    function refreshCurrentTab() {
      if (currentTab === 'messages') loadMessages();
      else if (currentTab === 'orders') loadOrders();
      else if (currentTab === 'products') loadProducts();
      else if (currentTab === 'coupons') loadCoupons();
      else if (currentTab === 'dashboard') loadDashboard();
      else if (currentTab === 'reviews') loadReviews();
      else if (currentTab === 'users') loadUsers();
      else if (currentTab === 'subscribers') loadSubscribers();
      else if (currentTab === 'refunds') loadRefundRequests();
    }

    async function adminLogin() {
      const pw = document.getElementById('adminPassword').value;
      const errEl = document.getElementById('adminLoginError');
      errEl.textContent = '';
      if (!pw) { errEl.textContent = 'Please enter your password.'; return; }
      try {
        const resp = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        if (resp.ok) {
          const data = await resp.json();
          token = data.token;
          localStorage.setItem(ADMIN_TOKEN_KEY, token);
          showDashboard();
          loadMessages();
        } else {
          const data = await resp.json().catch(() => ({}));
          errEl.textContent = data.error || 'Login failed.';
        }
      } catch (e) {
        errEl.textContent = 'Connection error. Please try again.';
      }
    }

    function adminLogout() {
      token = '';
      localStorage.removeItem(ADMIN_TOKEN_KEY);
      document.getElementById('adminPassword').value = '';
      showLogin();
    }

    // ===== Messages =====
    async function loadMessages() {
      const container = document.getElementById('adminMessages');
      container.innerHTML = '<div class="admin-loading">Loading messages…</div>';
      try {
        const resp = await fetch('/api/admin/messages', { headers: { 'x-admin-token': token } });
        if (resp.status === 401) { adminLogout(); return; }
        if (!resp.ok) throw new Error('Failed to load');
        const data = await resp.json();
        const messages = data.messages || [];
        const newCount = messages.filter(m => m.status === 'new').length;
        document.getElementById('adminCount').textContent = `${messages.length} total · ${newCount} unread`;
        if (messages.length === 0) {
          container.innerHTML = '<div class="empty-box">No customer messages yet. They will appear here as customers reach out.</div>';
          return;
        }
        container.innerHTML = messages.map(renderMessage).join('');
      } catch (e) {
        container.innerHTML = '<div class="empty-box">Could not load messages. Please refresh.</div>';
      }
    }

    function renderMessage(m) {
      const replies = (m.replies || []).map(r => `
        <div class="msg-reply">
          <div class="msg-reply-meta">Aurae Team · ${escapeHtml(formatDate(r.createdAt))}</div>
          <div class="msg-reply-body">${escapeHtml(r.reply)}</div>
        </div>`).join('');
      return `
        <div class="msg-card status-${escapeHtml(m.status)}" id="card-${escapeHtml(m.id)}">
          <div class="msg-head">
            <div class="msg-avatar">${escapeHtml((m.name || '?').charAt(0).toUpperCase())}</div>
            <div class="msg-meta">
              <div class="msg-name">${escapeHtml(m.name)} <span class="msg-status">${escapeHtml(m.status)}</span></div>
              <div class="msg-sub">${escapeHtml(m.email)} · ${escapeHtml(m.subject)} · ${escapeHtml(formatDate(m.createdAt))}</div>
            </div>
          </div>
          <div class="msg-body">${escapeHtml(m.message)}</div>
          ${replies ? `<div class="msg-replies">${replies}</div>` : ''}
          <div class="msg-reply-box">
            <textarea id="reply-${escapeHtml(m.id)}" placeholder="Type your reply to ${escapeHtml(m.name)}…"></textarea>
            <button class="btn btn-dark btn-sm" onclick="sendReply('${escapeHtml(m.id)}')">Send Reply</button>
          </div>
        </div>`;
    }

    async function sendReply(id) {
      const ta = document.getElementById('reply-' + id);
      const reply = (ta.value || '').trim();
      if (!reply) { alert('Please type a reply before sending.'); return; }
      const card = document.getElementById('card-' + id);
      const btn = card.querySelector('.msg-reply-box .btn');
      const original = btn.textContent;
      btn.textContent = 'Sending…';
      btn.disabled = true;
      try {
        const resp = await fetch('/api/admin/messages/' + id + '/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
          body: JSON.stringify({ reply }),
        });
        if (resp.ok) { ta.value = ''; loadMessages(); }
        else { const data = await resp.json().catch(() => ({})); alert(data.error || 'Failed to send reply.'); btn.textContent = original; btn.disabled = false; }
      } catch (e) { alert('Connection error. Please try again.'); btn.textContent = original; btn.disabled = false; }
    }

    // ===== Orders =====
    function exportOrdersCSV() {
      const url = '/api/admin/orders/export';
      const a = document.createElement('a');
      a.href = url;
      a.setAttribute('download', 'aurae-orders.csv');
      // Include auth token via a temporary header is not possible with simple link download,
      // so we fetch as blob and trigger download programmatically.
      fetch(url, { headers: { 'x-admin-token': token } })
        .then(r => { if (!r.ok) throw new Error('Export failed'); return r.blob(); })
        .then(blob => {
          const objUrl = URL.createObjectURL(blob);
          a.href = objUrl;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(objUrl);
        })
        .catch(() => alert('Failed to export orders. Please log in again.'));
    }

    async function loadOrders() {
      const container = document.getElementById('adminOrders');
      container.innerHTML = '<div class="admin-loading">Loading orders…</div>';
      try {
        const resp = await fetch('/api/admin/orders', { headers: { 'x-admin-token': token } });
        if (resp.status === 401) { adminLogout(); return; }
        if (!resp.ok) throw new Error('Failed');
        const data = await resp.json();
        allOrders = data.orders || [];
        renderOrdersList();
      } catch (e) { container.innerHTML = '<div class="empty-box">Could not load orders.</div>'; }
    }

    function renderOrder(o) {
      const id = escapeHtml(o.orderId);
      const items = (o.items || []).map(i => `<div>${escapeHtml(i.name)} × ${i.qty || 1} — ${money(i.price * (i.qty || 1))}</div>`).join('');
      const t = o.totals || {};
      const cust = o.customer || {};
      const total = (o.total != null) ? o.total : (t.total != null ? t.total : 0);
      const badge = `<span class="status-badge ${escapeHtml(o.status)}">${escapeHtml(o.status)}</span>`;
      return `
        <div class="order-card" id="order-${id}">
          <div class="order-head">
            <div>
              <div class="order-id">#${id}</div>
              <div class="order-meta">${escapeHtml(formatDate(o.createdAt))} · ${escapeHtml(cust.name || '')} &lt;${escapeHtml(cust.email || '')}&gt;${o.coupon ? ' · coupon ' + escapeHtml(o.coupon) : ''}</div>
            </div>
            ${badge}
          </div>
          <div class="order-items">
            ${items}
            <div style="margin-top:8px;border-top:1px solid var(--admin-border);padding-top:8px;">
              Subtotal ${money(t.subtotal)} ${t.discount ? '· Discount -' + money(t.discount) : ''} · Shipping ${t.shipping ? money(t.shipping) : 'FREE'} · Tax ${money(t.tax)} · <strong>Total ${money(total)}</strong>
            </div>
            ${o.trackingNumber ? `<div style="margin-top:6px;">Carrier: ${escapeHtml(o.carrier || 'Standard Shipping')} · Tracking: <strong>${escapeHtml(o.trackingNumber)}</strong></div>` : ''}
          </div>
          <div class="order-actions">
            <div><label>Tracking #</label><input type="text" id="track-${id}" value="${escapeHtml(o.trackingNumber || '')}" placeholder="1Z999AA..."></div>
            <div><label>Carrier</label><input type="text" id="carrier-${id}" value="${escapeHtml(o.carrier || 'Standard Shipping')}"></div>
            ${['pending_payment', 'expired'].includes(o.status) ? `<button class="btn btn-success btn-sm" onclick="markPaid('${id}')">💰 Mark Paid</button>` : ''}
            <button class="btn btn-dark btn-sm" onclick="markShipped('${id}')">📦 Mark Shipped</button>
            <button class="btn btn-outline btn-sm" onclick="markDelivered('${id}')">✅ Mark Delivered</button>
            <button class="btn btn-danger btn-sm" onclick="deleteOrder('${id}')">🗑️ Delete</button>
          </div>
        </div>`;
    }

    async function deleteOrder(id) {
      if (!confirm('Delete order #' + id + '? This cannot be undone.')) return;
      try {
        const resp = await fetch('/api/admin/orders/' + id, {
          method: 'DELETE',
          headers: { 'x-admin-token': token },
        });
        if (resp.ok) { loadOrders(); }
        else { const d = await resp.json().catch(()=>({})); alert(d.error || 'Failed to delete'); }
      } catch (e) { alert('Connection error'); }
    }

    async function markShipped(id) {
      const tracking = document.getElementById('track-' + id).value.trim();
      const carrier = document.getElementById('carrier-' + id).value.trim();
      try {
        const resp = await fetch('/api/admin/orders/' + id + '/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
          body: JSON.stringify({ status: 'shipped', trackingNumber: tracking, carrier }),
        });
        if (resp.ok) { loadOrders(); }
        else { const d = await resp.json().catch(()=>({})); alert(d.error || 'Failed'); }
      } catch (e) { alert('Connection error'); }
    }

    async function markDelivered(id) {
      try {
        const resp = await fetch('/api/admin/orders/' + id + '/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
          body: JSON.stringify({ status: 'delivered' }),
        });
        if (resp.ok) { loadOrders(); }
        else { const d = await resp.json().catch(()=>({})); alert(d.error || 'Failed'); }
      } catch (e) { alert('Connection error'); }
    }

    // ===== Dashboard =====
    async function loadDashboard() {
      const container = document.getElementById('adminDashboardContent');
      container.innerHTML = '<div class="admin-loading">Loading dashboard…</div>';
      try {
        const resp = await fetch('/api/admin/stats', { headers: { 'x-admin-token': token } });
        if (resp.status === 401) { adminLogout(); return; }
        if (!resp.ok) throw new Error('Failed');
        const s = await resp.json();
        document.getElementById('adminCount').textContent = `${s.totalOrders || 0} order(s)`;

        const cards = `
          <div class="dash-cards">
            <div class="dash-card"><div class="dash-card-label">Total Revenue</div><div class="dash-card-value">${money(s.revenue || 0)}</div></div>
            <div class="dash-card"><div class="dash-card-label">Paid Orders</div><div class="dash-card-value">${s.paidOrders || 0}</div></div>
            <div class="dash-card"><div class="dash-card-label">Avg Order Value</div><div class="dash-card-value">${money(s.avgOrderValue || 0)}</div></div>
            <div class="dash-card"><div class="dash-card-label">Customers</div><div class="dash-card-value">${s.customers || 0}</div></div>
            <div class="dash-card"><div class="dash-card-label">Pending Reviews</div><div class="dash-card-value">${s.pendingReviews || 0}</div></div>
            <div class="dash-card"><div class="dash-card-label">Low Stock</div><div class="dash-card-value">${(s.lowStock || []).length}</div></div>
          </div>`;

        const topRows = (s.topProducts || []).map((p, i) => `
          <tr><td>${i + 1}</td><td>${escapeHtml(p.name)}</td><td>${p.qty || 0}</td><td>${money(p.revenue || 0)}</td></tr>`).join('')
          || '<tr><td colspan="4" class="dash-empty">No sales recorded yet</td></tr>';

        const lowRows = (s.lowStock || []).map(p => `
          <tr><td>${escapeHtml(p.name)}</td><td><span class="pill ${p.stock <= 0 ? 'off' : (p.stock <= 5 ? '' : 'on')}">${p.stock}</span></td></tr>`).join('')
          || '<tr><td colspan="2" class="dash-empty">All items sufficiently stocked</td></tr>';

        const recentRows = (s.recentOrders || []).map(o => `
          <tr>
            <td>#${escapeHtml(o.orderId)}</td>
            <td>${escapeHtml((o.customer || {}).name || '—')}</td>
            <td>${escapeHtml(formatDate(o.createdAt))}</td>
            <td>${money(o.total || 0)}</td>
            <td><span class="status-badge ${escapeHtml(o.status)}">${escapeHtml(o.status)}</span></td>
          </tr>`).join('')
          || '<tr><td colspan="5" class="dash-empty">No orders yet</td></tr>';

        const maxRev = Math.max(1, ...(s.last7 || []).map(d => d.revenue));
        const bars = (s.last7 || []).map(d => {
          const h = Math.round((d.revenue / maxRev) * 100);
          const label = (d.date || '').slice(5);
          return `<div class="dash-bar"><div class="dash-bar-fill" style="height:${h}%;" title="${money(d.revenue)}"></div><div class="dash-bar-label">${escapeHtml(label)}</div><div class="dash-bar-val">${d.revenue > 0 ? money(d.revenue) : '—'}</div></div>`;
        }).join('');

        container.innerHTML = `
          ${cards}
          <div class="dash-grid">
            <div class="dash-box">
              <h3>🔥 Top Selling Products</h3>
              <table class="dash-table"><thead><tr><th>#</th><th>Product</th><th>Sold</th><th>Revenue</th></tr></thead><tbody>${topRows}</tbody></table>
            </div>
            <div class="dash-box">
              <h3>⚠️ Low Stock Alert</h3>
              <table class="dash-table"><thead><tr><th>Product</th><th>Stock</th></tr></thead><tbody>${lowRows}</tbody></table>
            </div>
          </div>
          <div class="dash-box">
            <h3>📊 Revenue — Last 7 Days</h3>
            <div class="dash-chart">${bars}</div>
          </div>
          <div class="dash-box">
            <h3>🧾 Recent Orders</h3>
            <table class="dash-table"><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody>${recentRows}</tbody></table>
          </div>`;
      } catch (e) {
        container.innerHTML = '<div class="empty-box">Could not load dashboard.</div>';
      }
    }

    // ===== Reviews / Moderation =====
    let reviewFilter = 'pending';
    let reviewProductNames = {};
    function setReviewFilter(status) {
      reviewFilter = status;
      document.querySelectorAll('.rf-btn').forEach(b => b.classList.toggle('active', b.dataset.status === status));
      loadReviews();
    }
    async function loadReviews() {
      const container = document.getElementById('adminReviews');
      container.innerHTML = '<div class="admin-loading">Loading reviews…</div>';
      try {
        const [prodResp, revResp] = await Promise.all([
          fetch('/api/admin/products', { headers: { 'x-admin-token': token } }),
          fetch('/api/admin/reviews' + (reviewFilter === 'all' ? '' : '?status=' + reviewFilter), { headers: { 'x-admin-token': token } }),
        ]);
        if (prodResp.status === 401 || revResp.status === 401) { adminLogout(); return; }
        const products = (await prodResp.json()).products || [];
        reviewProductNames = {};
        products.forEach(p => { reviewProductNames[p.id] = p.name; });
        const reviews = (await revResp.json()).reviews || [];
        document.getElementById('adminCount').textContent = `${reviews.length} review(s)` + (reviewFilter !== 'all' ? ` · ${reviewFilter}` : '');
        if (reviews.length === 0) {
          container.innerHTML = '<div class="empty-box">No ' + (reviewFilter === 'all' ? '' : reviewFilter + ' ') + 'reviews.</div>';
          return;
        }
        container.innerHTML = reviews.map(renderReviewCard).join('');
      } catch (e) {
        container.innerHTML = '<div class="empty-box">Could not load reviews.</div>';
      }
    }
    function stars(n) {
      const r = Number(n) || 0;
      return '★'.repeat(r) + '☆'.repeat(5 - r);
    }
    function renderReviewCard(r) {
      const imgs = Array.isArray(r.images) ? r.images : [];
      const imgHtml = imgs.length ? `<div class="rev-imgs">${imgs.map(i => `<a href="${escapeHtml(i)}" target="_blank"><img src="${escapeHtml(i)}" class="rev-img"></a>`).join('')}</div>` : '';
      const pname = reviewProductNames[r.productId] || r.productId;
      const isPending = r.status === 'pending';
      const isApproved = r.status === 'approved';
      const actions = `
        <div class="rev-actions">
          ${isPending ? `<button class="btn btn-dark btn-sm" onclick="moderateReview('${escapeHtml(r.id)}','approved')">✅ Approve</button>` : ''}
          ${!isApproved ? `<button class="btn btn-outline btn-sm" onclick="moderateReview('${escapeHtml(r.id)}','rejected')">⛔ Reject</button>` : ''}
          ${isApproved ? `<button class="btn btn-outline btn-sm" onclick="moderateReview('${escapeHtml(r.id)}','pending')">↩ Unpublish</button>` : ''}
          <button class="btn btn-danger btn-sm" onclick="deleteReview('${escapeHtml(r.id)}')">🗑 Delete</button>
        </div>`;
      return `
        <div class="rev-card status-${escapeHtml(r.status)}" id="rev-${escapeHtml(r.id)}">
          <div class="rev-head">
            <div class="rev-avatar">${escapeHtml((r.name || '?').charAt(0).toUpperCase())}</div>
            <div class="rev-meta">
              <div class="rev-name">${escapeHtml(r.name)} <span class="rev-rating">${stars(r.rating)}</span> <span class="rev-status">${escapeHtml(r.status)}</span></div>
              <div class="rev-sub">${escapeHtml(r.email)} · on <strong>${escapeHtml(pname)}</strong> · ${escapeHtml(formatDate(r.createdAt))}</div>
            </div>
          </div>
          ${r.title ? `<div class="rev-title">${escapeHtml(r.title)}</div>` : ''}
          <div class="rev-body">${escapeHtml(r.comment)}</div>
          ${imgHtml}
          ${actions}
        </div>`;
    }
    async function moderateReview(id, status) {
      try {
        const resp = await fetch('/api/admin/reviews/' + id + '/status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
          body: JSON.stringify({ status }),
        });
        if (resp.ok) loadReviews();
        else { const d = await resp.json().catch(() => ({})); alert(d.error || 'Failed'); }
      } catch (e) { alert('Connection error'); }
    }
    async function deleteReview(id) {
      if (!confirm('Delete this review permanently?')) return;
      try {
        const resp = await fetch('/api/admin/reviews/' + id, {
          method: 'DELETE',
          headers: { 'x-admin-token': token },
        });
        if (resp.ok) loadReviews();
        else { const d = await resp.json().catch(() => ({})); alert(d.error || 'Failed'); }
      } catch (e) { alert('Connection error'); }
    }

      container.innerHTML = '<div class="admin-loading">Loading refund requests…</div>';

        const resp = await fetch('/api/admin/refund-requests', { headers: { 'x-admin-token': token } });

              </div>
              <div style="font-size:13px;margin-bottom:8px;"><strong>Customer:</strong> ${escapeHtml(r.userEmail || '')}</div>
              <div style="font-size:13px;margin-bottom:12px;background:var(--color-bg-alt);padding:10px;border-radius:8px;">${escapeHtml(r.reason)}</div>
              ${r.note ? `<div style="font-size:12px;color:var(--color-text-muted);margin-bottom:12px;">Note: ${escapeHtml(r.note)}</div>` : ''}
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                ${['pending','approved','rejected','resolved'].map(st => `<button class="btn btn-sm ${r.status === st ? 'btn-dark' : 'btn-outline'}" onclick="updateRefundStatus('${escapeHtml(r.id)}', '${st}')">Mark ${st}</button>`).join('')}

        else { const d = await resp.json().catch(() => ({})); alert(d.error || 'Failed to update'); }

    // ===== Products / Inventory =====
    async function loadProducts() {
      const container = document.getElementById('adminProducts');
      container.innerHTML = '<div class="admin-loading">Loading inventory…</div>';
      try {
        const resp = await fetch('/api/admin/products', { headers: { 'x-admin-token': token } });

    function renderProductCard(p) {
      const imgs = Array.isArray(p.images) ? p.images : (p.image ? [p.image] : []);
      const thumb = imgs[0] || p.image || '';
      const cls = p.stock <= 0 ? 'out' : (p.stock <= 5 ? 'low' : 'in');
      const label = p.stock <= 0 ? 'Sold Out' : (p.stock <= 5 ? 'Low Stock' : 'In Stock');
      return `
        <div class="product-card" id="pcard-${escapeHtml(p.id)}">
          ${thumb ? `<img class="product-thumb" src="${escapeHtml(thumb)}" alt="">` : '<div class="product-thumb"></div>'}
          <div class="product-info">
            <h4>${escapeHtml(p.name)} <span style="color:var(--admin-muted);font-weight:400;font-size:13px;">(${escapeHtml(p.id)})</span></h4>
            <div class="meta">${money(p.price)}${p.compareAt ? ' <s style="color:#b0aba0;">' + money(p.compareAt) + '</s>' : ''} · <span class="pill ${cls === 'in' ? 'on' : (cls === 'out' ? 'off' : '')}">${label}</span> · ${escapeHtml(p.category || '')}</div>
            <div class="meta" style="margin-top:4px;">${imgs.length} image(s)</div>
          </div>
          <div class="product-actions">
            <button class="btn btn-dark btn-sm" onclick="openProductEditor('${escapeHtml(p.id)}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteProduct('${escapeHtml(p.id)}')">Delete</button>
          </div>
        </div>`;
    }

    let editingProductId = null;

    async function openProductEditor(id) {
      editingProductId = id || null;
      const form = document.getElementById('productForm');
      form.reset();
      document.getElementById('imageManager').innerHTML = '<div style="color:var(--admin-muted);font-size:13px;padding:8px 0;">No images yet. Upload below.</div>';
      const idEl = document.getElementById('pf_id');
      idEl.readOnly = false;
      if (id) {
        document.getElementById('productModalTitle').textContent = 'Edit Product · ' + id;
        try {
          const resp = await fetch('/api/admin/products', { headers: { 'x-admin-token': token } });
          const data = await resp.json();
          const p = (data.products || []).find(x => x.id === id);
          if (p) fillProductForm(p);
        } catch (e) {}
      } else {
        document.getElementById('productModalTitle').textContent = 'Add Product';
        renderVariantEditor(null);
      }
      document.getElementById('productModal').style.display = 'flex';
    }

    function fillProductForm(p) {
      const set = (fid, val) => { const el = document.getElementById(fid); if (el) el.value = (val == null ? '' : val); };
      set('pf_id', p.id);
      set('pf_name', p.name);
      set('pf_nameCN', p.nameCN);
      set('pf_tagline', p.tagline);
      set('pf_price', p.price);
      set('pf_compareAt', p.compareAt);
      set('pf_category', p.category);
      set('pf_intention', p.intention);
      set('pf_crystal', p.crystal);
      set('pf_crystalCN', p.crystalCN);
      set('pf_chakra', p.chakra);
      set('pf_element', p.element);
      set('pf_planet', p.planet);
      set('pf_description', p.description);
      set('pf_ritual', p.ritual);
      set('pf_rating', p.rating);
      set('pf_reviews', p.reviews);
      set('pf_stock', p.stock);
      set('pf_badge', p.badge);
      set('pf_properties', Array.isArray(p.properties) ? p.properties.join('\n') : (p.properties || ''));
      renderVariantStockInputs(p);
      renderVariantEditor(p);
      const sup = p.supplier || {};
      set('pf_sup_platform', sup.platform);
      set('pf_sup_shop', sup.shop);
      set('pf_sup_url', sup.shopUrl);
      set('pf_sup_location', sup.location);
      set('pf_sup_price', sup.wholesalePrice);
      set('pf_sup_moq', sup.moq);
      set('pf_sup_lead', sup.leadTime);
      set('pf_sup_years', sup.years);
      set('pf_sup_rating', sup.rating);
      renderImageManager(p.images || (p.image ? [p.image] : []));
      document.getElementById('pf_id').readOnly = true;
    }

    function renderVariantStockInputs(p) {
      const wrap = document.getElementById('variantStockWrap');
      const container = document.getElementById('variantStockInputs');
      if (!wrap || !container) return;
      if (!p.variants || !Array.isArray(p.variants) || p.variants.length === 0 || !p.variants[0].options || p.variants[0].options.length === 0) {
        wrap.style.display = 'none';
        container.innerHTML = '';
        return;
      }
      wrap.style.display = 'block';
      const map = p.variantStock || {};
      const inputs = [];
      p.variants.forEach(v => {
        v.options.forEach(opt => {
          const key = `${v.name}:${opt}`;
          const val = map[key] != null ? map[key] : '';
          inputs.push(`<div><label style="font-size:12px;color:var(--admin-muted);display:block;margin-bottom:4px;">${escapeHtml(key)}</label><input type="number" min="0" class="variant-stock-input" data-key="${escapeHtml(key)}" value="${val === '' ? '' : Number(val)}"></div>`);
        });
      });
      container.innerHTML = inputs.join('');
    }

    function collectVariantStock() {
      const out = {};
      document.querySelectorAll('.variant-stock-input').forEach(el => {
        const key = el.getAttribute('data-key');
        const v = el.value.trim();
        if (key) out[key] = v === '' ? null : Number(v);
      });
      return out;
    }

    // ===== Variant editor (single dimension: name + options with per-option price) =====
    let variantEditorState = { name: '', options: [] };

    function renderVariantEditor(p) {
      const editor = document.getElementById('variantEditor');
      if (!editor) return;
      if (p && Array.isArray(p.variants) && p.variants.length && Array.isArray(p.variants[0].options) && p.variants[0].options.length) {
        const v0 = p.variants[0];
        variantEditorState.name = v0.name || '';
        variantEditorState.options = v0.options.map((opt, i) => ({
          text: opt,
          price: (p.variantPrices && p.variantPrices[i] != null && p.variantPrices[i] !== '') ? p.variantPrices[i] : '',
        }));
      } else {
        variantEditorState = { name: '', options: [{ text: '', price: '' }] };
      }
      paintVariantEditor();
    }

    function paintVariantEditor() {
      const editor = document.getElementById('variantEditor');
      if (!editor) return;
      const opts = variantEditorState.options.map((o, i) => `
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;">
          <input type="text" class="vopt-text" data-i="${i}" value="${escapeHtml(o.text)}" placeholder="Option label (e.g. 8mm)" style="flex:1;">
          <div style="display:flex;align-items:center;white-space:nowrap;">$&nbsp;<input type="number" step="0.01" min="0" class="vopt-price" data-i="${i}" value="${o.price === '' ? '' : Number(o.price)}" placeholder="price" style="width:120px;"></div>
          <button type="button" class="btn btn-danger btn-sm" onclick="removeVariantOption(${i})">×</button>
        </div>`).join('');
      editor.innerHTML = `
        <div style="margin-bottom:10px;">
          <label style="font-size:12px;color:var(--admin-muted);display:block;margin-bottom:4px;">Variant name</label>
          <input type="text" id="variantName" value="${escapeHtml(variantEditorState.name)}" placeholder="Bead Size" style="max-width:300px;">
        </div>
        <div id="variantOptions">${opts}</div>`;
      repaintStockForVariantEditor();
    }

    // Keep option text/price state in sync with what the user types.
    document.addEventListener('input', (e) => {
      if (e.target && e.target.classList && e.target.classList.contains('vopt-text')) {
        const i = Number(e.target.getAttribute('data-i'));
        if (variantEditorState.options[i]) variantEditorState.options[i].text = e.target.value;
      } else if (e.target && e.target.classList && e.target.classList.contains('vopt-price')) {
        const i = Number(e.target.getAttribute('data-i'));
        if (variantEditorState.options[i]) variantEditorState.options[i].price = e.target.value;
      } else if (e.target && e.target.id === 'variantName') {
        variantEditorState.name = e.target.value;
      }
    });

    function addVariantOption() {
      variantEditorState.options.push({ text: '', price: '' });
      paintVariantEditor();
    }
    function removeVariantOption(i) {
      variantEditorState.options.splice(i, 1);
      paintVariantEditor();
    }

    function collectVariants() {
      const basePrice = parseFloat(document.getElementById('pf_price').value) || 0;
      const name = (variantEditorState.name || '').trim();
      const options = variantEditorState.options
        .map(o => ({ text: (o.text || '').trim(), price: (o.price === '' || o.price == null) ? null : Number(o.price) }))
        .filter(o => o.text);
      if (!name || options.length === 0) return { variants: [], variantPrices: [] };
      return {
        variants: [{ name, options: options.map(o => o.text) }],
        variantPrices: options.map(o => o.price == null ? basePrice : o.price),
      };
    }

    function repaintStockForVariantEditor() {
      const collected = collectVariants();
      const wrap = document.getElementById('variantStockWrap');
      const c = document.getElementById('variantStockInputs');
      if (!wrap || !c) return;
      if (!collected.variants.length) { wrap.style.display = 'none'; c.innerHTML = ''; return; }
      const existing = collectVariantStock();
      renderVariantStockInputs({ variants: collected.variants, variantStock: existing });
    }

    function renderImageManager(images) {
      const wrap = document.getElementById('imageManager');
      const imgs = (images || []).map(String).filter(Boolean);
      if (imgs.length === 0) {
        wrap.innerHTML = '<div style="color:var(--admin-muted);font-size:13px;padding:8px 0;">No images yet. Upload below.</div>';
        return;
      }
      wrap.innerHTML = imgs.map((img, i) => `
        <div class="img-cell ${i === 0 ? 'cover' : ''}" id="imgcell-${i}">
          <img src="${escapeHtml(img)}" alt="">
          <button class="del" title="Delete" onclick="deleteProductImage(${i})">×</button>
          ${i !== 0 ? `<button class="setcover" onclick="setCoverImage(${i})">SET COVER</button>` : ''}
        </div>`).join('');
    }

    async function uploadProductImage() {
      if (!editingProductId) { alert('Save the product first (click Save Product), then upload images.'); return; }
      const input = document.getElementById('pf_imageFile');
      if (!input.files || !input.files[0]) { alert('Choose an image file first.'); return; }
      const fd = new FormData();
      fd.append('image', input.files[0]);
      try {
        const resp = await fetch('/api/admin/products/' + encodeURIComponent(editingProductId) + '/images', {
          method: 'POST', headers: { 'x-admin-token': token }, body: fd,
        });
        if (resp.ok) {
          const data = await resp.json();
          renderImageManager(data.product.images);
          input.value = '';
        } else { const d = await resp.json().catch(()=>({})); alert(d.error || 'Upload failed'); }
      } catch (e) { alert('Connection error'); }
    }

    async function deleteProductImage(index) {
      if (!editingProductId) return;
      if (!confirm('Delete this image?')) return;
      try {
        const resp = await fetch('/api/admin/products/' + encodeURIComponent(editingProductId) + '/images/' + index, {
          method: 'DELETE', headers: { 'x-admin-token': token },
        });
        if (resp.ok) { const d = await resp.json(); renderImageManager(d.product.images); }
        else { const d = await resp.json().catch(()=>({})); alert(d.error || 'Failed'); }
      } catch (e) { alert('Connection error'); }
    }

    async function setCoverImage(index) {
      if (!editingProductId) return;
      try {
        const resp = await fetch('/api/admin/products', { headers: { 'x-admin-token': token } });
        const data = await resp.json();
        const p = (data.products || []).find(x => x.id === editingProductId);
        if (!p) return;
        const imgs = (p.images || []).slice();
        if (index < 0 || index >= imgs.length) return;
        const [sel] = imgs.splice(index, 1);
        imgs.unshift(sel);
        const r2 = await fetch('/api/admin/products/' + encodeURIComponent(editingProductId), {
          method: 'PUT', headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
          body: JSON.stringify({ images: imgs }),
        });
        if (r2.ok) { const d = await r2.json(); renderImageManager(d.product.images); }
      } catch (e) { alert('Connection error'); }
    }

    function collectSupplier() {
      const g = (id) => { const el = document.getElementById(id); return el ? (el.value || '').trim() : ''; };
      const sup = {
        platform: g('pf_sup_platform'),
        shop: g('pf_sup_shop'),
        shopUrl: g('pf_sup_url'),
        location: g('pf_sup_location'),
        wholesalePrice: g('pf_sup_price'),
        moq: g('pf_sup_moq'),
        leadTime: g('pf_sup_lead'),
        years: g('pf_sup_years'),
        rating: g('pf_sup_rating'),
      };
      if (Object.values(sup).every(v => !v)) return {};
      return sup;
    }

    async function saveProduct(e) {
      e.preventDefault();
      const fields = ['id','name','nameCN','tagline','price','compareAt','category','intention','crystal','crystalCN','chakra','element','planet','description','ritual','rating','reviews','stock','badge','properties'];
      const payload = {};
      for (const f of fields) {
        const el = document.getElementById('pf_' + f);
        if (!el) continue;
        let v = el.value;
        if (['price','compareAt','rating','reviews','stock'].includes(f)) {
          // New products default rating to 0 (no fake 5-star). compareAt stays null when empty.
          if (v === '') v = (f === 'compareAt' ? null : 0);
          else v = Number(v);
        }
        payload[f] = v;
      }
      payload.variantStock = collectVariantStock();
      const variantsObj = collectVariants();
      payload.variants = variantsObj.variants;
      payload.variantPrices = variantsObj.variantPrices;
      payload.supplier = collectSupplier();
      const isEdit = !!editingProductId;
      const url = isEdit ? '/api/admin/products/' + encodeURIComponent(editingProductId) : '/api/admin/products';
      const method = isEdit ? 'PUT' : 'POST';
      try {
        const resp = await fetch(url, {
          method, headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
          body: JSON.stringify(payload),
        });
        if (resp.ok) {
          const d = await resp.json();
          if (!isEdit && d.product) {
            editingProductId = d.product.id;
            document.getElementById('pf_id').value = d.product.id;
            document.getElementById('pf_id').readOnly = true;
            document.getElementById('productModalTitle').textContent = 'Edit Product · ' + d.product.id;
          }
          if (d.product && d.product.images) renderImageManager(d.product.images);
          loadProducts();
          alert(isEdit ? 'Product updated.' : 'Product created. You can now upload images.');
        } else { const d = await resp.json().catch(()=>({})); alert(d.error || 'Failed to save'); }
      } catch (err) { alert('Connection error'); }
      return false;
    }

    async function deleteProduct(id) {
      if (!confirm('Delete product ' + id + '? This also removes its uploaded images.')) return;
      try {
        const resp = await fetch('/api/admin/products/' + encodeURIComponent(id), { method: 'DELETE', headers: { 'x-admin-token': token } });
        if (resp.ok) loadProducts();
        else { const d = await resp.json().catch(()=>({})); alert(d.error || 'Failed'); }
      } catch (e) { alert('Connection error'); }
    }

    function closeProductEditor() {
      document.getElementById('productModal').style.display = 'none';
      editingProductId = null;
    }

    // ===== Coupons =====
    async function loadCoupons() {
      const container = document.getElementById('adminCoupons');
      container.innerHTML = '<div class="admin-loading">Loading coupons…</div>';
      try {
        const resp = await fetch('/api/admin/coupons', { headers: { 'x-admin-token': token } });
        if (resp.status === 401) { adminLogout(); return; }
        if (!resp.ok) throw new Error('Failed');
        const data = await resp.json();
        const coupons = data.coupons || [];
        document.getElementById('adminCount').textContent = `${coupons.length} coupon(s)`;
        if (coupons.length === 0) { container.innerHTML = '<div class="empty-box">No coupons yet.</div>'; return; }
        const rows = coupons.map(c => {
          const val = c.type === 'percent' ? c.value + '%' : '$' + c.value;
          return `<tr>
            <td><strong>${escapeHtml(c.code)}</strong></td>
            <td>${val}</td>
            <td>${c.minSubtotal ? '$' + c.minSubtotal + '+' : '—'}</td>
            <td>${c.firstOrderOnly ? 'Yes' : 'No'}</td>
            <td>${c.usedCount || 0}</td>
            <td><span class="pill ${c.active ? 'on' : 'off'}">${c.active ? 'Active' : 'Inactive'}</span></td>
            <td class="row-actions">
              <button class="btn btn-outline btn-sm" onclick="toggleCoupon('${escapeHtml(c.code)}', ${!c.active})">${c.active ? 'Deactivate' : 'Activate'}</button>
              <button class="btn btn-danger btn-sm" onclick="deleteCoupon('${escapeHtml(c.code)}')">Delete</button>
            </td>
          </tr>`;
        }).join('');
        container.innerHTML = `<table class="admin-table"><thead><tr><th>Code</th><th>Value</th><th>Min</th><th>First Order</th><th>Used</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
      } catch (e) { container.innerHTML = '<div class="empty-box">Could not load coupons.</div>'; }
    }

    async function createCoupon(e) {
      e.preventDefault();
      const payload = {
        code: document.getElementById('cpCode').value.trim(),
        type: document.getElementById('cpType').value,
        value: parseFloat(document.getElementById('cpValue').value),
        minSubtotal: parseFloat(document.getElementById('cpMin').value) || 0,
        firstOrderOnly: document.getElementById('cpFirst').checked,
        active: document.getElementById('cpActive').checked,
        description: document.getElementById('cpDesc').value.trim(),
      };
      try {
        const resp = await fetch('/api/admin/coupons', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
          body: JSON.stringify(payload),
        });
        if (resp.ok) { e.target.reset(); loadCoupons(); }
        else { const d = await resp.json().catch(()=>({})); alert(d.error || 'Failed to create'); }
      } catch (err) { alert('Connection error'); }
      return false;
    }

    async function toggleCoupon(code, active) {
      try {
        const resp = await fetch('/api/admin/coupons/' + encodeURIComponent(code), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
          body: JSON.stringify({ active }),
        });
        if (resp.ok) loadCoupons();
        else { const d = await resp.json().catch(()=>({})); alert(d.error || 'Failed'); }
      } catch (e) { alert('Connection error'); }
    }

    async function deleteCoupon(code) {
      if (!confirm('Delete coupon ' + code + '?')) return;
      try {
        const resp = await fetch('/api/admin/coupons/' + encodeURIComponent(code), {
          method: 'DELETE',
          headers: { 'x-admin-token': token },
        });
        if (resp.ok) loadCoupons();
        else { const d = await resp.json().catch(()=>({})); alert(d.error || 'Failed'); }
      } catch (e) { alert('Connection error'); }
    }

    // ===== Mark Paid (manual payment recording) =====
    async function markPaid(id) {
      if (!confirm('Mark order #' + id + ' as paid? This deducts stock and triggers the confirmation email.')) return;
      try {
        const resp = await fetch('/api/admin/orders/' + id + '/finalize', {
          method: 'POST', headers: { 'x-admin-token': token },
        });
        if (resp.ok) { loadOrders(); }
        else { const d = await resp.json().catch(()=>({})); alert(d.error || 'Failed to mark paid'); }
      } catch (e) { alert('Connection error'); }
    }

    // ===== Change Password =====
    function openChangePassword() {
      document.getElementById('pwNew').value = '';
      document.getElementById('pwConfirm').value = '';
      document.getElementById('pwError').textContent = '';
      document.getElementById('passwordModal').style.display = 'flex';
    }
    function closeChangePassword() {
      document.getElementById('passwordModal').style.display = 'none';
    }
    async function changePassword() {
      const nw = document.getElementById('pwNew').value;
      const cf = document.getElementById('pwConfirm').value;
      const err = document.getElementById('pwError');
      err.textContent = '';
      if (!nw || nw.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
      if (nw !== cf) { err.textContent = 'Passwords do not match.'; return; }
      try {
        const resp = await fetch('/api/admin/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
          body: JSON.stringify({ newPassword: nw }),
        });
        if (resp.ok) {
          const d = await resp.json();
          token = d.token;
          localStorage.setItem(ADMIN_TOKEN_KEY, token);
          closeChangePassword();
          alert('Password updated successfully. You remain logged in.');
        } else { const d = await resp.json().catch(()=>({})); err.textContent = d.error || 'Failed to change password.'; }
      } catch (e) { err.textContent = 'Connection error.'; }
    }

    // ===== Search + Pagination for list panels =====
    const PAGE_SIZE = 10;
    let allOrders = [], orderPage = 1;
    let allProducts = [], productPage = 1;
    let allUsers = [], userPage = 1;
    let allSubscribers = [], subscriberPage = 1;

    function pagerHtml(total, page, gotoFn) {
      const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      const start = (page - 1) * PAGE_SIZE;
      const end = Math.min(start + PAGE_SIZE, total);
      const prev = `<button class="btn btn-outline btn-sm" ${page <= 1 ? 'disabled' : ''} onclick="${gotoFn}(${page - 1})">← Prev</button>`;
      const next = `<button class="btn btn-outline btn-sm" ${page >= pages ? 'disabled' : ''} onclick="${gotoFn}(${page + 1})">Next →</button>`;
      return `<span style="font-size:13px;color:var(--admin-muted);">Showing ${total ? start + 1 : 0}-${end} of ${total}</span><div style="display:flex;gap:8px;">${prev}${next}</div>`;
    }

    function renderOrdersList() {
      const container = document.getElementById('adminOrders');
      const pager = document.getElementById('adminOrdersPager');
      const q = (document.getElementById('orderSearch').value || '').trim().toLowerCase();
      let list = allOrders;
      if (q) list = allOrders.filter(o => {
        const c = o.customer || {};
        return [o.orderId, c.name, c.email, o.status, o.coupon].filter(Boolean).join(' ').toLowerCase().includes(q);
      });
      const total = list.length;
      const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (orderPage > pages) orderPage = pages;
      const start = (orderPage - 1) * PAGE_SIZE;
      const slice = list.slice(start, start + PAGE_SIZE);
      document.getElementById('adminCount').textContent = `${total} order(s)`;
      if (total === 0) { container.innerHTML = '<div class="empty-box">No orders' + (q ? ' match your search.' : ' yet.') + '</div>'; pager.innerHTML = ''; return; }
      container.innerHTML = slice.map(renderOrder).join('');
      pager.innerHTML = pagerHtml(total, orderPage, 'gotoOrderPage');
    }
    function onOrderSearch() { orderPage = 1; renderOrdersList(); }
    function gotoOrderPage(p) { orderPage = p; renderOrdersList(); }

    function renderProductsList() {
      const container = document.getElementById('adminProducts');
      const pager = document.getElementById('adminProductsPager');
      const q = (document.getElementById('productSearch').value || '').trim().toLowerCase();
      let list = allProducts;
      if (q) list = allProducts.filter(p => [p.id, p.name, p.category].filter(Boolean).join(' ').toLowerCase().includes(q));
      const total = list.length;
      const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (productPage > pages) productPage = pages;
      const start = (productPage - 1) * PAGE_SIZE;
      const slice = list.slice(start, start + PAGE_SIZE);
      document.getElementById('adminCount').textContent = `${total} product(s)`;
      document.getElementById('productCountNote').textContent = `${total} product(s) total`;
      if (total === 0) { container.innerHTML = '<div class="empty-box">No products' + (q ? ' match your search.' : ' yet. Click "+ Add Product" to create your first one.') + '</div>'; pager.innerHTML = ''; return; }
      container.innerHTML = slice.map(renderProductCard).join('');
      pager.innerHTML = pagerHtml(total, productPage, 'gotoProductPage');
    }
    function onProductSearch() { productPage = 1; renderProductsList(); }
    function gotoProductPage(p) { productPage = p; renderProductsList(); }

    function renderUsersList() {
      const container = document.getElementById('adminUsers');
      const pager = document.getElementById('adminUsersPager');
      const q = (document.getElementById('userSearch').value || '').trim().toLowerCase();
      let list = allUsers;
      if (q) list = allUsers.filter(u => [u.name, u.email].filter(Boolean).join(' ').toLowerCase().includes(q));
      const total = list.length;
      const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (userPage > pages) userPage = pages;
      const start = (userPage - 1) * PAGE_SIZE;
      const slice = list.slice(start, start + PAGE_SIZE);
      document.getElementById('adminCount').textContent = `${total} user(s)`;
      if (total === 0) { container.innerHTML = '<div class="empty-box">No registered users' + (q ? ' match your search.' : ' yet.') + '</div>'; pager.innerHTML = ''; return; }
      container.innerHTML = `
        <div class="user-table">
          <div class="user-row user-head"><div>Name</div><div>Email</div><div>Joined</div><div>Orders</div><div></div></div>
          ${slice.map(u => `
            <div class="user-row" id="user-${escapeHtml(u.id)}">
              <div class="user-name">${escapeHtml(u.name || '—')}</div>
              <div class="user-email">${escapeHtml(u.email)}</div>
              <div class="user-date">${escapeHtml(formatDate(u.createdAt))}</div>
              <div class="user-orders">${u.orderCount || 0}</div>
              <div class="user-actions"><button class="btn btn-danger btn-sm" onclick="deleteUser('${escapeHtml(u.id)}')">🗑 Delete</button></div>
            </div>`).join('')}
        </div>`;
      pager.innerHTML = pagerHtml(total, userPage, 'gotoUserPage');
    }
    function onUserSearch() { userPage = 1; renderUsersList(); }
    function gotoUserPage(p) { userPage = p; renderUsersList(); }

    function renderSubscribersList() {
      const container = document.getElementById('adminSubscribers');
      const pager = document.getElementById('adminSubscribersPager');
      const q = (document.getElementById('subscriberSearch').value || '').trim().toLowerCase();
      let list = allSubscribers;
      if (q) list = allSubscribers.filter(s => (s.email || '').toLowerCase().includes(q));
      const total = list.length;
      const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (subscriberPage > pages) subscriberPage = pages;
      const start = (subscriberPage - 1) * PAGE_SIZE;
      const slice = list.slice(start, start + PAGE_SIZE);
      document.getElementById('adminCount').textContent = `${total} subscriber(s)`;
      if (total === 0) { container.innerHTML = '<div class="empty-box">No newsletter subscribers' + (q ? ' match your search.' : ' yet.') + '</div>'; pager.innerHTML = ''; return; }
      container.innerHTML = `
        <div class="user-table">
          <div class="user-row user-head"><div>Email</div><div>Subscribed At</div></div>
          ${slice.map(s => `
            <div class="user-row">
              <div class="user-email">${escapeHtml(s.email)}</div>
              <div class="user-date">${escapeHtml(formatDate(s.createdAt))}</div>
            </div>`).join('')}
        </div>
        <button class="btn btn-outline btn-sm" style="margin-top:16px;" onclick="copySubscribers()">📋 Copy email list</button>`;
      pager.innerHTML = pagerHtml(total, subscriberPage, 'gotoSubscriberPage');
    }
    function onSubscriberSearch() { subscriberPage = 1; renderSubscribersList(); }
    function gotoSubscriberPage(p) { subscriberPage = p; renderSubscribersList(); }

    // On page load, auto-login if token exists
    if (token) { showDashboard(); loadMessages(); }
  </script>

</body>
</html>
