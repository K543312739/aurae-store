<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Aurae</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #f9f7f4;
      --color-surface: #fff;
      --color-primary: #4a5d3e;
      --color-primary-dark: #2f3d28;
      --color-text: #2a2a2a;
      --color-text-muted: #777;
      --color-border: #e8e0d8;
      --radius-md: 14px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      box-shadow: 0 12px 40px rgba(0,0,0,0.06);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      margin: 0 0 8px;
      color: var(--color-primary-dark);
    }
    p { color: var(--color-text-muted); margin: 0 0 28px; font-size: 14px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: inherit;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--color-primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.92; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #2a2a2a;
      color: #fff;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 14px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      display: none;
      z-index: 1000;
    }
    .back { display: inline-block; margin-top: 20px; color: var(--color-primary); font-size: 14px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset Password</h1>
    <p>Choose a new password for your Aurae account.</p>
    <form id="resetForm">
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="resetPassword" required minlength="6" placeholder="At least 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="resetPasswordConfirm" required minlength="6" placeholder="Repeat password">
      </div>
      <button type="submit" class="btn" id="submitBtn">Update Password</button>
    </form>
    <a href="index.html" class="back">Back to store</a>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');
      const password = document.getElementById('resetPassword').value;
      const confirm = document.getElementById('resetPasswordConfirm').value;
      const btn = document.getElementById('submitBtn');
      if (!token) { showToast('Invalid reset link.'); return; }
      if (password.length < 6) { showToast('Password must be at least 6 characters.'); return; }
      if (password !== confirm) { showToast('Passwords do not match.'); return; }
      btn.disabled = true;
      try {
        const resp = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        if (resp.ok) {
          showToast('Password updated! Redirecting…');
          setTimeout(() => window.location.href = 'index.html', 1500);
        } else {
          const data = await resp.json();
          showToast(data.error || 'Reset link expired or invalid.');
          btn.disabled = false;
        }
      } catch (err) {
        showToast('Network error. Please try again.');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
